name: Windows MSVC Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK not found' }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Configure MSVC 2022 x64
        shell: pwsh
        run: |
          cmake -S . -B build/windows-x64 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON -DBUILD_SHARED_LIBS=ON -DACID_ENABLE_AUDIO=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Release
        shell: pwsh
        run: cmake --build build/windows-x64 --config Release --parallel 4

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build/windows-x64 -C Release --output-on-failure

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Acid-Windows-x64
          path: |
            build/windows-x64/**/*.exe
            build/windows-x64/**/*.dll
            build/windows-x64/**/*.lib
            build/windows-x64/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
